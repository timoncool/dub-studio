[package]
name = "dub-faces"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Кастинг персонажей: детект лиц (SCRFD) + эмбеддинг (LVFace-L) + кластеризация + связка лицо↔голос"

[dependencies]
dub-core = { path = "../dub-core" }
tracing = { workspace = true }
# ort строго той же версии, что dub-asr/dub-ocr (=2.0.0-rc.13, load-dynamic + api-28): ДВЕ разные версии
# ort в одном бинаре = рассинхрон OrtApi -> дедлок (тот же трап, что чужая system32 DLL). ensure_ort_dylib()
# тут повторяет паттерн dub-ocr: ORT_DYLIB_PATH -> onnxruntime 1.31.0. ndarray (версия = та, что у ort)
# для тензоров SCRFD/LVFace.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray", "tracing", "api-28", "cuda"] }
ndarray = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# кластеризация эмбеддингов лиц — берём готовые cosine/cluster_embeddings из dub-asr (#83), не дублируем.
dub-asr = { path = "../dub-asr" }
# WAV-декод реф-клипа голоса для WeSpeaker-эмбеддера (voice.rs). Та же версия, что dub-asr/dub-server.
hound = "3.5"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[[example]]
name = "smoke"
path = "examples/smoke.rs"
