[package]
name = "dub-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Экранный OCR (PP-OCR ONNX: DBNet det + CRNN rec) для блюр-боксов вшитого текста. Порт text_detect.py + compose.py"

[dependencies]
dub-core = { path = "../dub-core", features = ["ort"] }
# ort строго той же версии и с теми же фичами, что dub-asr (=2.0.0-rc.15, load-dynamic + api-31): ДВЕ
# разные версии ort в одном бинаре = рассинхрон OrtApi -> дедлок (тот же трап, что чужая system32 DLL).
# библиотеку выбирает dub_core::runtime::ensure_ort_dylib: ORT_DYLIB_PATH -> onnxruntime 1.31.1.
# load-dynamic (disable-linking) — onnxruntime.dll грузится в рантайме через ORT_DYLIB_PATH (общая
# 1.31.1, ensure_ort_dylib). БЕЗ download-binaries: он требует TLS-фичу (ureq) и тянет линкуемую
# сборку EP. api-31: OrtApi под onnxruntime 1.31.x. ndarray: TensorRef::from_array_view /
# try_extract_tensor; версия ndarray = та, что у ort.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "ndarray", "tracing", "api-31"] }
ndarray = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
cuda = ["ort/cuda"]

[[example]]
name = "ocr"
path = "examples/ocr.rs"
