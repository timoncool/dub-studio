[package]
name = "dub-asr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ASR + диаризация над parakeet-rs (Parakeet-TDT + Nemotron 3 Diarization)"

[dependencies]
dub-core = { path = "../dub-core" }
# load-dynamic: onnxruntime подгружается из onnxruntime.dll в рантайме, а не линкуется статически.
# Это обходит рассинхрон MSVC STL (статическая libort_sys собрана новее локального тулчейна) и заодно
# делает движок портативным (DLL кладётся рядом с бинарём / ищется по ORT_DYLIB_PATH).
# Строго 0.3.8: диаризация — только Nemotron 3 Diarization (nemotron3_diar_v3.onnx, до 8 спикеров);
# Sortformer v2 (diar_streaming_sortformer_4spk-v2.onnx) эта версия не грузит.
# default-features = false: дефолт parakeet-rs включает ort/default (download-binaries + TLS).
parakeet-rs = { version = "=0.4.0", default-features = false, features = ["sortformer", "load-dynamic", "api-28"] }
# ort через load-dynamic (disable-linking): onnxruntime.dll 1.28.2 грузится в рантайме через
# ORT_DYLIB_PATH (ensure_ort_dylib), а не линкуется (статическая libort_sys собрана новее локального
# MSVC STL и не слинкуется). Версия строго rc.13 — под onnxruntime 1.28.2; DLL с другим OrtApi
# вешает commit_from_file. БЕЗ download-binaries: он требует TLS-фичу (ureq) и тянет линкуемую
# сборку EP. DLL лежит в models/runtime/. api-28 фиксирует OrtApi под 1.28.x. tracing: логи
# onnxruntime идут в tracing-подписчик сервера. ort нужен напрямую для
# ExecutionConfig::with_custom_configure (уровень оптимизации графа).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "tracing", "api-28"] }
hound = "3.5"
# Ресемплинг с ограничением полосы (FFT-ресемплер, как audio-post студий).
rubato = "5.0"
audioadapter = "5.0"
audioadapter-buffers = "5.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
# GPU-исполнение onnxruntime. По умолчанию CPU (провайдер по докам). Собираем CPU в раунде 1.
cuda = ["parakeet-rs/cuda"]

[[example]]
name = "asr"
path = "examples/asr.rs"
