[package]
name = "dub-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Типы Project и EngineOpts — зеркало Pydantic-контракта dub-engine"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# compat: the release checks of built and downloaded binaries (PE and ELF headers, AVX-512 instructions).
object = { version = "0.41", default-features = false, features = ["read_core", "elf", "pe", "std"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
# runtime::ort_env: the one ONNX Runtime environment of the process, for every crate that makes sessions.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "tracing", "api-31"], optional = true }
# normalize_ru: Russian numbers, dates, times and money as words for the voice engines (shared with Speech Studio).
regex = "1"
num2words2-core = "0.2"
num-bigint = "0.4"

[features]
ort = ["dep:ort"]

[dev-dependencies]
# compat's tests write the stand-in binaries they check.
object = { version = "0.41", default-features = false, features = ["read_core", "elf", "pe", "std", "write"] }

# PR_SET_PDEATHSIG: дети не переживают студию на Linux (proc::dies_with_parent).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
