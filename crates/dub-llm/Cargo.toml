[package]
name = "dub-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Сайдкар llama-server (llama.cpp CUDA) + OpenAI-совместимый чат-клиент с vision (mmproj), OpenRouter и прокси-маршрут"

[dependencies]
dub-core = { path = "../dub-core" }
# Блокирующий HTTP-клиент: тела джоб синхронные (spawn_blocking). rustls — облако (OpenRouter) и свой сервер по
# https; socks — прокси socks5/socks4 для облачных запросов; system-proxy — Matcher::from_system (реестр Windows).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "socks", "system-proxy"] }
# Системный прокси (Windows «Параметры → Сеть → Прокси» и HTTP(S)_PROXY/ALL_PROXY/NO_PROXY), как в net.rs студий.
hyper-util = { version = "0.1", features = ["client-proxy", "client-proxy-system"] }
http = "1"
# Логин и пароль прокси в адресе — %XX (RFC 3986 userinfo); кодирование и раскодирование как у url/reqwest.
percent-encoding = "2"
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
base64 = "0.23"
hound = "3"

[features]
# Поддельный HTTP-сервер для тестов провайдеров в зависимых крейтах (dev-dependency).
test-support = []

[[example]]
name = "llm_smoke"
path = "examples/llm_smoke.rs"
