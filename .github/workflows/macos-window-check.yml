name: macos-window-check

# The released .dmg on a Mac as a user gets it: mounted, the app started, its window opened, and the studio asked
# through its MCP as an agent would - version and readiness, then every screen of the window read back.
# Runs only when the macos-window-check branch is pushed; the screenshot is kept for a day.
on:
  push:
    branches: [macos-window-check]

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VERSION: "4.6.0"
      # the "macOS build" run whose dmg is checked; empty takes the dmg of the release
      BUILD_RUN: "43004032527"
      PORT: "8794"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The dmg, mounted and copied out
        run: |
          if [ -n "$BUILD_RUN" ]; then
            gh run download "$BUILD_RUN" -R "$GITHUB_REPOSITORY" -n dub-studio-macos-arm64 -D "$RUNNER_TEMP"
          else
            gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -p "Dub-Studio-$VERSION-macos-arm64.dmg" -D "$RUNNER_TEMP"
          fi
          shasum -a 256 "$RUNNER_TEMP/Dub-Studio-$VERSION-macos-arm64.dmg"
          hdiutil attach -nobrowse -readonly -mountpoint /Volumes/dub "$RUNNER_TEMP/Dub-Studio-$VERSION-macos-arm64.dmg"
          ls /Volumes/dub
          cp -R "/Volumes/dub/Dub Studio.app" "$RUNNER_TEMP/"
          hdiutil detach /Volumes/dub
          codesign -dv "$RUNNER_TEMP/Dub Studio.app" 2>&1 | head -5 || true
      - name: The app started, its service answers
        run: |
          app="$RUNNER_TEMP/Dub Studio.app/Contents/MacOS/Dub-Studio"
          DUB_STUDIO_PORT="$PORT" nohup "$app" > "$RUNNER_TEMP/run.log" 2>&1 &
          for i in $(seq 1 120); do
            curl -s -m 2 "http://127.0.0.1:$PORT/mcp/status" >/dev/null && break
            sleep 2
          done
          curl -sf -m 5 "http://127.0.0.1:$PORT/mcp/status" || { echo "[ERROR] no answer on $PORT"; tail -50 "$RUNNER_TEMP/run.log"; exit 1; }
          echo
          for i in $(seq 1 30); do
            curl -s -m 5 "http://127.0.0.1:$PORT/mcp/status" | grep -q '"window_open":true' && break
            sleep 2
          done
          curl -s -m 5 "http://127.0.0.1:$PORT/mcp/status"; echo
      - name: What the Mac shows
        if: always()
        run: |
          echo "== processes"; ps -axo pid,stat,etime,command | grep -iE "Dub-Studio|WebContent|WebKit" | grep -v grep | head
          echo "== connections to the service"; lsof -nP -iTCP:"$PORT" | head -20
          echo "== windows"; osascript -e 'tell application "System Events" to get {name, position, size} of every window of (every process whose name contains "Dub")' 2>&1 | head -5
          echo "== session"; who; launchctl managername 2>&1
          screencapture -x "$RUNNER_TEMP/shot-$VERSION.png" && ls -la "$RUNNER_TEMP/shot-$VERSION.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-window-${{ env.VERSION }}
          path: ${{ runner.temp }}/shot-*.png
          retention-days: 1
      - name: The window is open
        run: |
          echo "== data"; ls ~/"Library/Application Support/Dub Studio" 2>&1 | head
          curl -s -m 5 "http://127.0.0.1:$PORT/mcp/status" | grep -q '"window_open":true' || { echo "[ERROR] the window did not open"; exit 1; }
          echo "[OK] window open"
      - name: Every screen through the MCP
        run: |
          u="http://127.0.0.1:$PORT/mcp"
          call() { curl -s -m 60 -H "content-type: application/json" -d "{\"jsonrpc\":\"2.0\",\"id\":9,\"method\":\"tools/call\",\"params\":{\"name\":\"$1\",\"arguments\":$2}}" "$u"; }
          text() { node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).result.content[0].text)}catch(e){process.stdout.write(s)}})"; }
          call studio_status '{}' > raw.txt
          text < raw.txt > status.txt
          grep -oE '"version":"[0-9.]+"' raw.txt | head -1
          grep -q "\"version\":\"$VERSION\"" raw.txt || { echo "[ERROR] not $VERSION"; head -c 800 raw.txt; exit 1; }
          grep -oE '"(ready|driver_ok)": [a-z]+|"id": "[a-z0-9-]+"' status.txt | head -14
          fail=0
          page() {
            call ui_read_page '{}' | text > page.txt
            lines=$(wc -l < page.txt); errs=$(grep -ciE 'ошибк|error|failed|не удалось' page.txt || true)
            echo "$1: $lines lines, $errs error lines"
            grep -iE 'ошибк|error|failed|не удалось' page.txt | head -3
            [ "$lines" -gt 5 ] || fail=1
          }
          call ui_navigate '{"view":"home"}' >/dev/null; sleep 2; page home
          head -25 page.txt
          for s in models cloud quality network interface agent about; do
            call ui_open_settings "{\"section\":\"$s\"}" >/dev/null; sleep 2; page "settings:$s"
          done
          screencapture -x "$RUNNER_TEMP/shot.png" && echo "screen captured: $(stat -f%z "$RUNNER_TEMP/shot.png") bytes" || true
          [ "$fail" = 0 ] || { echo "[ERROR] a screen read back empty"; exit 1; }
          echo "[OK] all screens read through the MCP"
      - name: The hardware the studio sees
        run: |
          echo "== /engine/presets"; curl -s -m 60 "http://127.0.0.1:$PORT/engine/presets" | head -c 1500; echo
          echo "== gpu"; curl -s -m 60 "http://127.0.0.1:$PORT/setup/status" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(JSON.stringify({ready:j.ready,driverOk:j.driverOk,gpu:j.gpu,llama:j.llamaBuild,missing:j.components.filter(c=>c.requirement==='required'&&!c.installed).map(c=>c.id)}))})"
      - name: Work through the MCP - components downloaded, a spoken sentence recognised
        run: |
          u="http://127.0.0.1:$PORT/mcp"
          call() { curl -s -m "${3:-120}" -H "content-type: application/json" -d "{\"jsonrpc\":\"2.0\",\"id\":9,\"method\":\"tools/call\",\"params\":{\"name\":\"$1\",\"arguments\":$2}}" "$u"; }
          text() { node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const r=JSON.parse(s);process.stdout.write((r.error?'[mcp error] '+JSON.stringify(r.error):'')+(r.result?.isError?'[tool error] ':'')+(r.result?.content?.[0]?.text??''))}catch(e){process.stdout.write(s)}})"; }
          ids='["higgs-engine","transcribe-engine-cpu","parakeet","onnxruntime","ffmpeg"]'
          call models_download "{\"ids\":$ids}" | text | head -c 600; echo
          for i in $(seq 1 60); do
            st=$(curl -s -m 30 "http://127.0.0.1:$PORT/setup/status")
            left=$(echo "$st" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const want=$ids;const c=j.components.filter(c=>want.includes(c.id));console.log(c.filter(c=>!c.installed).map(c=>c.id).join(',')||'none')})")
            echo "[..] not yet installed: $left"
            [ "$left" = none ] && break
            sleep 20
          done
          [ "$left" = none ] || { echo "[ERROR] the download did not finish"; exit 1; }
          say -v Samantha -o "$RUNNER_TEMP/speech.aiff" "The quick brown fox jumps over the lazy dog near the river bank."
          afconvert -f WAVE -d LEI16@16000 -c 1 "$RUNNER_TEMP/speech.aiff" "$RUNNER_TEMP/speech.wav"
          args="{\"path\":\"$RUNNER_TEMP/speech.wav\",\"src_lang\":\"en\",\"diarize\":false,\"format\":\"text\"}"
          for i in $(seq 1 20); do
            out=$(call transcribe_file "$args" 300 | text)
            job=$(echo "$out" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);if(j.done===false&&j.job)process.stdout.write(j.job.id)}catch(e){}})")
            [ -z "$job" ] && break
            echo "[..] job $job"
            call studio_wait "{\"job_id\":\"$job\",\"seconds\":55}" 90 | text | head -c 300; echo
          done
          echo "== transcript"; echo "$out" | head -c 1500; echo
          echo "$out" | grep -qi "fox" && echo "$out" | grep -qi "river" || { echo "[ERROR] the sentence was not recognised"; exit 1; }
          echo "[OK] the spoken sentence came back as text"
      - name: Why an engine stopped
        if: failure()
        run: |
          echo "== Metal on this Mac"; system_profiler SPDisplaysDataType 2>&1 | head -20
          data=~/"Library/Application Support/Dub Studio"
          find "$data" -iname "audiocpp_server*" -not -name "*.gguf" 2>/dev/null | head
          find "$data" \( -iname "audiocpp_server*.log" -o -iname "*output*.txt" -o -iname "*.out" -o -iname "*stderr*" \) 2>/dev/null | head -5 | while IFS= read -r f; do echo "== $f"; tail -60 "$f"; done
          echo "== crash reports"; ls -la ~/Library/Logs/DiagnosticReports/ 2>&1 | grep -i audiocpp | head
          for f in $(ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i audiocpp | head -1); do head -c 6000 ~/Library/Logs/DiagnosticReports/"$f"; echo; done
      - name: The app's log
        if: always()
        run: tail -40 "$RUNNER_TEMP/run.log" || true
