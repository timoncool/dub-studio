name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      - name: Build workspace
        run: cargo build --workspace
      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
      - name: ffmpeg is there
        shell: bash
        run: ffmpeg -hide_banner -version | head -n 1 && ffprobe -hide_banner -version | head -n 1
      - name: Test workspace
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log
      - name: Failed tests
        if: failure()
        shell: bash
        run: |
          grep -E "^test .* FAILED$|^error(\[|:)" test.log | head -40 | sed 's/^/::error::/'
          grep -A6 "panicked at" test.log | awk 'BEGIN { RS = "--\n" } { gsub(/\r?\n/, " | "); print "::error::" $0 }' | head -30
      # The desktop shell embeds frontend/dist at compile time and dist is not in git.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend for the desktop shell
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Test desktop shell
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Lint (45 existing errors, does not fail the job yet)
        run: npm run lint
        continue-on-error: true
      - name: Unit tests
        run: npm run test --if-present
