name: Dub Studio 4.6.1 NSIS QA
'on':
  push:
    branches: ['qa/dub-461-nsis']

permissions:
  contents: read

jobs:
  fetch:
    if: github.repository == 'timoncool/dub-studio' && !github.event.deleted
    name: Fetch pinned draft and upgrade baseline
    # GitHub requires push access to see an unpublished release.
    permissions: {contents: write}
    runs-on: windows-2022
    timeout-minutes: 12
    outputs:
      artifact-name: dub-461-qa-${{ github.run_attempt }}
    steps:
      - name: Fetch fixed release assets
        shell: pwsh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') {
            throw 'Refusing to run outside GitHub-hosted Actions.'
          }
          $root = Join-Path (Resolve-Path -LiteralPath $env:RUNNER_TEMP).Path 'dub-461-qa'
          if (Test-Path -LiteralPath $root) { throw "QA destination already exists: $root" }
          $json = gh release view v4.6.1 --repo timoncool/dub-studio --json isDraft,tagName,targetCommitish
          if ($LASTEXITCODE -ne 0) { throw "gh release view failed ($LASTEXITCODE)" }
          $release = ($json -join "`n") | ConvertFrom-Json
          if ($release.isDraft -isnot [bool] -or !$release.isDraft -or
              $release.tagName -cne 'v4.6.1' -or
              $release.targetCommitish -cne '1d65c80f0866cf5518b0fec22734452b0ed4ae53') {
            throw 'Refusing downloads: expected the exact v4.6.1 draft and release commit.'
          }
          New-Item -ItemType Directory -Path $root | Out-Null
          function Download([string]$tag, [string]$asset) {
            gh release download $tag --repo timoncool/dub-studio --pattern $asset --dir $root
            if ($LASTEXITCODE -ne 0) { throw "gh failed ($LASTEXITCODE): $tag / $asset" }
          }
          Download 'v4.6.1' 'Dub.Studio_4.6.1_x64-setup.exe'
          Download 'v4.6.1' 'Dub.Studio_4.6.1_x64-setup.exe.sig'
          Download 'v4.6.1' 'latest.json'
          Download 'v4.6.0' 'Dub.Studio_4.6.0_x64-setup.exe'

      - name: Stage QA assets for this run only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dub-461-qa-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dub-461-qa/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  nsis:
    needs: fetch
    if: github.repository == 'timoncool/dub-studio' && !github.event.deleted
    name: NSIS / ${{ matrix.mode }}
    permissions: {contents: read}
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [clean, upgrade]
    defaults:
      run:
        shell: pwsh
    env:
      QA_MODE: ${{ matrix.mode }}
    steps:
      - name: Require a fresh hosted artifact destination
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') {
            throw 'Refusing to run outside GitHub-hosted Actions.'
          }
          $root = Join-Path (Resolve-Path -LiteralPath $env:RUNNER_TEMP).Path 'dub-461-qa'
          if (Test-Path -LiteralPath $root) { throw "QA destination already exists: $root" }

      - name: Download staged assets from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.fetch.outputs.artifact-name }}
          path: ${{ runner.temp }}/dub-461-qa

      - name: Verify release, install silently, inspect installed state
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') {
            throw 'Refusing to run outside GitHub-hosted Actions.'
          }
          $root = Join-Path (Resolve-Path -LiteralPath $env:RUNNER_TEMP).Path 'dub-461-qa'
          $install = Join-Path $root 'Dub Studio QA'
          $default = Join-Path $env:LOCALAPPDATA 'Dub Studio'
          $uninstall = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Dub Studio'
          $product = 'HKCU:\Software\dubstudio\Dub Studio'
          $exe = Join-Path $install 'Dub-Studio.exe'
          function Evidence([string]$line) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $line }
          function RequireAbsent([string]$path) {
            if (Test-Path -LiteralPath $path) { throw "Expected absent: $path" }
          }
          function VerifyHash([string]$path, [string]$expected) {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash
            if ($actual -ne $expected) { throw "SHA256 mismatch for $path ($actual)" }
            Evidence "- SHA256 verified: $(Split-Path -Leaf $path) = $actual"
          }
          function CheckVersion([string]$expected) {
            $info = (Get-Item -LiteralPath $exe).VersionInfo
            $actual = '{0}.{1}.{2}.{3}' -f $info.FileMajorPart,$info.FileMinorPart,$info.FileBuildPart,$info.FilePrivatePart
            if ($actual -cne "$expected.0") { throw "$exe has PE file version $actual, expected $expected.0" }
            Evidence "- Installed PE version: $actual at $exe"
          }
          function InstallNsis([string]$setup, [string]$arguments) {
            $proc = Start-Process -Wait -PassThru -FilePath $setup -ArgumentList $arguments
            if ($proc.ExitCode -ne 0) { throw "NSIS failed ($($proc.ExitCode)): $setup" }
          }

          Evidence "### Dub Studio NSIS / $env:QA_MODE (installer and disk state only; no UI launch)"
          foreach ($path in $install,$default,$uninstall,$product) { RequireAbsent $path }
          $name = 'Dub.Studio_4.6.1_x64-setup.exe'
          $new = Join-Path $root $name
          VerifyHash $new '4fec9721025f66b6f776ee9b3d6c36ec292e7d80d92c82b30cc5254ef2784cd4'
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $root 'latest.json') | ConvertFrom-Json
          $sig = (Get-Content -Raw -LiteralPath "$new.sig").TrimEnd("`r","`n")
          if (!$sig -or $manifest.version -cne '4.6.1') { throw 'Missing signature or wrong manifest version' }
          $url = "https://github.com/timoncool/dub-studio/releases/download/v4.6.1/$name"
          foreach ($key in 'windows-x86_64','windows-x86_64-nsis') {
            $entry = $manifest.platforms.$key
            if ($entry.url -cne $url -or $entry.signature -cne $sig) { throw "Bad updater entry: $key" }
            Evidence "- ${key}: exact v4.6.1 URL and signature text match (not cryptographic verification)."
          }

          $sentinels = @{}
          if ($env:QA_MODE -eq 'upgrade') {
            $old = Join-Path $root 'Dub.Studio_4.6.0_x64-setup.exe'
            VerifyHash $old '6759569d24cd893ed262902510997ad3fe29a4534eff70c663f29a88c065c9c0'
            InstallNsis $old "/S /D=$install"
            CheckVersion '4.6.0'
            RequireAbsent $default
            foreach ($relative in 'models\runtime','models\higgs-engine','workspace') {
              $dir = Join-Path $install $relative
              [void][IO.Directory]::CreateDirectory($dir)
              $path = Join-Path $dir 'dub-qa-sentinel.txt'
              RequireAbsent $path
              New-Item -ItemType File -Path $path -Value "Keep ${relative}: $([guid]::NewGuid())" | Out-Null
              $sentinels[$path] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
              Evidence "- Before upgrade: $relative sentinel SHA256 = $($sentinels[$path])"
            }
            InstallNsis $new "/S /UPDATE /D=$install"
          } elseif ($env:QA_MODE -eq 'clean') {
            InstallNsis $new "/S /D=$install"
          } else { throw "Unexpected mode: $env:QA_MODE" }

          CheckVersion '4.6.1'
          RequireAbsent (Join-Path $install 'portable.flag')
          RequireAbsent $default
          foreach ($path in $sentinels.Keys) { VerifyHash $path $sentinels[$path] }
          $record = Get-ItemProperty -LiteralPath $uninstall
          if ($record.DisplayVersion -cne '4.6.1' -or $record.InstallLocation.Trim('"') -ne $install) {
            throw 'Unexpected HKCU uninstall version or location'
          }
          Evidence "- HKCU DisplayVersion = $($record.DisplayVersion); InstallLocation = $install; default folder and portable.flag absent."

          $groups = [ordered]@{
            'fonts' = ('Anton-Regular BebasNeue-Regular Caveat Comfortaa-Regular Exo2-Regular FiraSans-Regular LeagueSpartan MarckScript-Regular Montserrat-Bold Montserrat NotoSans-Regular Oswald-Bold Oswald Pacifico-Regular Pangolin-Regular Philosopher-Regular PlayfairDisplay Poppins-Bold Prata-Regular Roboto-Bold Roboto Rubik-Regular RussoOne-Regular YesevaOne-Regular'.Split(' ') | ForEach-Object { "$_.ttf" })
            'models\higgs-engine' = 'MSVCP140.dll','MSVCP140_1.dll','VCOMP140.DLL','VCRUNTIME140.dll','VCRUNTIME140_1.dll'
            'models\ocr' = 'det.onnx','cls.onnx','rec_cyrillic.onnx','rec_cyrillic.dict.txt','rec_ch.onnx','rec_ch.dict.txt'
            'frontend\dist' = @('index.html')
          }
          foreach ($dir in $groups.Keys) {
            foreach ($leaf in $groups[$dir]) {
              $file = Get-Item -LiteralPath (Join-Path $install "$dir\$leaf")
              if ($file.PSIsContainer -or $file.Length -le 0) { throw "Missing payload content: $file" }
            }
            Evidence "- ${dir}: $($groups[$dir].Count) required nonempty files verified."
          }
          foreach ($pattern in 'index-*.js','index-*.css') {
            $assets = @(Get-ChildItem -LiteralPath (Join-Path $install 'frontend\dist\assets') -File -Filter $pattern | Where-Object Length -gt 0)
            if (!$assets.Count) { throw "Missing nonempty frontend bundle: $pattern" }
            Evidence "- Frontend asset: $($assets.Name -join ', ')"
          }
